AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Entry-level Weather Explorer API

Parameters:
  AllowedOrigins:
    Type: String
    Default: '*'

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512

Resources:
  WeatherBucket:
    Type: AWS::S3::Bucket

  WeatherApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.main.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref WeatherBucket
      Environment:
        Variables:
          WEATHER_BUCKET: !Ref WeatherBucket
          ALLOWED_ORIGINS: !Ref AllowedOrigins
      Events:
        ApiProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: API Gateway endpoint
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/'
  BucketName:
    Value: !Ref WeatherBucket
